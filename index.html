<title>MindLoop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: a maths exercise book. Graph-paper ground, biro-blue ink, highlighter yellow for the moments that matter (points, rewards). One centred column, cards only where something is a separate object. */
:root{
  --paper:#F6F8FC; --grid:#E1E8F3; --card:#FFFFFF; --ink:#1B2A4A; --soft:#56657F; --line:#CDD7E6;
  --biro:#2D57CC; --biro-wash:#E7EEFF; --marker:#FFD84D; --marker-ink:#4A3700; --marker-wash:#FFF6CC;
  --go:#1C8455; --go-wash:#E2F4EA; --calm:#7A5BB5; --calm-wash:#F0EAFA; --stop:#B8452F; --stop-wash:#FBEAE6;
  --display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111A2C; --grid:#18233A; --card:#18233A; --ink:#E7EDF8; --soft:#A5B2C9; --line:#2B3A58;
  --biro:#86A6FF; --biro-wash:#1E2C4D; --marker:#F2C83A; --marker-ink:#2B2000; --marker-wash:#3A3216;
  --go:#58C794; --go-wash:#16352A; --calm:#B9A0EA; --calm-wash:#2A2342; --stop:#F08A72; --stop-wash:#3D2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111A2C; --grid:#18233A; --card:#18233A; --ink:#E7EDF8; --soft:#A5B2C9; --line:#2B3A58;
  --biro:#86A6FF; --biro-wash:#1E2C4D; --marker:#F2C83A; --marker-ink:#2B2000; --marker-wash:#3A3216;
  --go:#58C794; --go-wash:#16352A; --calm:#B9A0EA; --calm-wash:#2A2342; --stop:#F08A72; --stop-wash:#3D2220; color-scheme:dark}

html,body{min-height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--biro);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--soft)} .small{font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.loop{background:linear-gradient(90deg,#1E6BFF,#14C8E0 60%,#19E6B4);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.logo{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--marker);color:var(--marker-ink);font-size:1.2rem}
.tag{font-family:var(--body);font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:500;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

main{padding-block:24px 120px;display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--biro)}
.btn.primary{background:var(--biro);border-color:var(--biro);color:var(--card);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--biro);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

label.f{display:grid;gap:4px;font-size:.88rem;font-weight:500}
input[type=text],input[type=tel],input[type=date],input[type=password],select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
.ans-in{font-size:1.2rem;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);width:11em;max-width:100%;font-variant-numeric:tabular-nums}
.ans-in:focus{border-color:var(--biro);outline:none}

/* option cards for tier/billing */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{position:relative;border:2px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;background:var(--card);display:grid;gap:4px}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){border-color:var(--biro);background:var(--biro-wash)}
.opt:has(input:focus-visible){outline:3px solid var(--biro);outline-offset:2px}
.price{font-family:var(--display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}

/* points meter */
.meter{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:2px dashed var(--line)}
.dot.on{background:var(--marker);border:2px solid var(--marker);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.hl{background:linear-gradient(transparent 55%,var(--marker) 55%);padding:0 2px}

/* home tiles */
.tile{display:grid;gap:10px;align-content:start;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;color:inherit}
.tile:hover{border-color:var(--biro)}
.tile[aria-disabled="true"]{cursor:default}
.tile[aria-disabled="true"]:hover{border-color:var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;width:fit-content}
.pill.go{background:var(--go-wash);color:var(--go)} .pill.lock{background:var(--paper);color:var(--soft);border:1px solid var(--line)}
.pill.mark{background:var(--marker-wash);color:var(--ink)} .pill.calm{background:var(--calm-wash);color:var(--calm)}
.pill.stop{background:var(--stop-wash);color:var(--stop)} .pill.biro{background:var(--biro-wash);color:var(--biro)}

/* lesson */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--soft)}
.step.now{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.step.done{color:var(--go);border-color:var(--go)}
.explain p{max-width:65ch;font-size:1.02rem}
.q-grid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:20px}
@media (max-width:640px){.q-grid{grid-template-columns:minmax(0,1fr)}}
.hint{background:var(--marker-wash);border-radius:10px;padding:10px 14px;font-size:.92rem}
.qtext{font-family:var(--display);font-size:1.7rem;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.qtext.words{font-family:var(--body);font-size:1.15rem;font-weight:500}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle}
.fr span:first-child{border-bottom:3px solid currentColor;padding:0 4px 3px}
.fr span:last-child{padding:3px 4px 0}
.helpcol{display:grid;gap:8px;align-content:start}
.helpcol .btn{text-align:left;display:flex;gap:8px;align-items:center}
.panel{border-left:4px solid var(--calm);background:var(--calm-wash);border-radius:0 10px 10px 0;padding:12px 14px;font-size:.95rem}
.panel ol{margin:6px 0 0;padding-left:20px}
.fb{font-weight:500;padding:10px 14px;border-radius:10px}
.fb.right{background:var(--go-wash);color:var(--go)}
.fb.again{background:var(--biro-wash);color:var(--ink)}

/* visuals */
.bar{display:flex;gap:3px;max-width:420px}
.bar i{flex:1;height:34px;border-radius:5px;border:2px solid var(--line);background:var(--card)}
.bar i.a{background:var(--biro);border-color:var(--biro)} .bar i.b{background:var(--marker);border-color:var(--marker)}
.pv{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:1.05rem}
.pv th,.pv td{border:1px solid var(--line);padding:6px 12px;text-align:center}
.pv th{font-size:.75rem;color:var(--soft);font-weight:600}
.sq{display:grid;gap:2px;width:fit-content}
.sq i{width:22px;height:22px;background:var(--biro-wash);border:1px solid var(--biro)}

/* chat */
.chat{display:grid;grid-template-rows:auto 1fr auto;gap:12px;min-height:420px}
.msgs{display:grid;gap:10px;align-content:start;max-height:52vh;overflow-y:auto;padding-right:4px}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--biro);color:var(--card);border-bottom-right-radius:4px}
.msg.ai{justify-self:start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.chip:hover{border-color:var(--biro)}
.send{display:flex;gap:8px}
.send input{flex:1}
.lockbox{display:grid;gap:12px;justify-items:start;padding:20px;border-radius:var(--r);background:var(--stop-wash)}

/* recaps */
.formula{font-family:var(--display);font-size:1.25rem;font-weight:700;background:var(--marker-wash);border-radius:10px;padding:10px 14px}
.list{display:grid;gap:8px}
.li{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.li[aria-current="true"]{border-color:var(--biro);background:var(--biro-wash)}

/* parent */
.stat{display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.1}
.prog{height:10px;border-radius:99px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--biro)}
.phases{display:flex;gap:6px;flex-wrap:wrap}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:left .15s}
.sw:checked{background:var(--go)} .sw:checked::after{left:21px}
table.log{width:100%;border-collapse:collapse;font-size:.9rem}
table.log td,table.log th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}

/* app shell (Mathspace-style) */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.appbar-in{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;padding-block:8px;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--soft);font-weight:500;border-radius:8px;position:relative}
.tabs button:hover{color:var(--ink);background:var(--paper)}
.tabs button[aria-current="page"]{color:var(--biro);font-weight:600}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-9px;height:3px;border-radius:3px 3px 0 0;background:var(--biro)}
.stats{display:flex;gap:14px;align-items:center;margin-left:auto;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.stats span{display:flex;gap:5px;align-items:center}
.demo{display:flex;gap:4px;align-items:center;font-size:.78rem}
.demo button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 10px;cursor:pointer;color:var(--soft)}
.demo button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--biro-wash);line-height:1;flex:none}
.av.f-gold{box-shadow:0 0 0 3px #E8B923} .av.f-blue{box-shadow:0 0 0 3px #2D57CC} .av.f-rainbow{box-shadow:0 0 0 3px transparent;background-clip:padding-box;outline:3px solid #E85D75;outline-offset:0} .av.f-green{box-shadow:0 0 0 3px #1C8455}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:820px){.dash{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:16px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mini-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;font-family:var(--display);font-weight:700}
.mini-b{padding:10px 16px 14px;display:grid;gap:10px}
.mini-f{border-top:1px solid var(--line);padding:10px;text-align:center}
.task{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);display:grid;max-width:260px;cursor:pointer;text-align:left;padding:0;color:inherit}
.task:hover{border-color:var(--biro)}
.task-art{height:110px;display:grid;place-items:center;font-size:2.6rem;background:var(--marker-wash)}
.task-b{padding:12px;display:grid;gap:8px}
.reward{display:flex;justify-content:flex-end;gap:6px;background:var(--paper);border-radius:99px;padding:4px 10px;font-weight:600;font-size:.85rem}
.cards{display:flex;gap:14px;flex-wrap:wrap}
/* textbook */
.book{display:grid;grid-template-columns:260px minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:540px}
@media (max-width:720px){.book{grid-template-columns:minmax(0,1fr)}}
.toc{border-right:1px solid var(--line);padding:12px;display:grid;gap:8px;align-content:start}
.toc-book{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.toc-book i{width:30px;height:40px;border-radius:4px;background:linear-gradient(160deg,var(--biro),#1C8455);flex:none}
.chap{border:0;background:none;text-align:left;padding:8px 6px;border-radius:8px;cursor:pointer;color:var(--ink);width:100%}
.chap:hover{background:var(--paper)}
.chap[aria-expanded="true"]{font-weight:600}
.sub{display:grid;padding-left:14px}
.sub button{border:0;background:none;text-align:left;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:.9rem;color:var(--soft)}
.sub button[aria-current="true"]{background:var(--biro-wash);color:var(--biro);font-weight:600}
.sub span{padding:6px 8px;font-size:.85rem;color:var(--soft);opacity:.7}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:60px 20px;color:var(--soft)}
.book-c{padding:24px;display:grid;gap:14px;align-content:start;background:var(--paper)}
/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px;display:grid;gap:8px;justify-items:center;text-align:center}
.item.on{border-color:var(--biro);box-shadow:0 0 0 2px var(--biro)}
.swatch{width:100%;height:70px;border-radius:10px;border:1px solid var(--line)}
/* themed backgrounds */
body[data-bg="space"]{--bgc:#1D2340;background-color:#1D2340;background-image:radial-gradient(2px 2px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 70% 20%,#FFD84D 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 70%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 85% 65%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 10% 85%,#B9A0EA 50%,transparent 51%);background-size:340px 340px}
body[data-bg="ocean"]{background-color:#0E5E7A;background-image:radial-gradient(circle at 20% 110%,#2BB3C0 0 30%,transparent 31%),radial-gradient(circle at 80% 120%,#1A8FA6 0 35%,transparent 36%),linear-gradient(#0B3D5C,#0E5E7A)}
body[data-bg="sunset"]{background-color:#F59E6B;background-image:linear-gradient(#FFB76B 0%,#F27C6B 45%,#8D5BB8 100%);background-attachment:fixed}
body[data-bg="forest"]{background-color:#2F6B47;background-image:repeating-linear-gradient(115deg,#2F6B47 0 40px,#357A50 40px 80px)}
body[data-bg="space"] .onbg,body[data-bg="ocean"] .onbg,body[data-bg="sunset"] .onbg,body[data-bg="forest"] .onbg{color:#fff}
body[data-bg="space"] .onbg .label,body[data-bg="ocean"] .onbg .label,body[data-bg="sunset"] .onbg .label,body[data-bg="forest"] .onbg .label,body[data-bg="space"] .onbg .muted,body[data-bg="ocean"] .onbg .muted,body[data-bg="sunset"] .onbg .muted,body[data-bg="forest"] .onbg .muted{color:rgba(255,255,255,.8)}
body:not([data-bg="paper"]):not([data-bg="plain"]) footer .muted{color:rgba(255,255,255,.75)}
body[data-bg="plain"]{background-image:none}
/* multiple choice */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;max-width:640px}
.choice{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px;font-size:1.05rem;font-weight:600;cursor:pointer;text-align:left;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.choice:hover{border-color:var(--biro)}
.choice:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.diagram{max-width:100%;overflow-x:auto}
/* intro slides */
.intro{max-width:620px;margin:24px auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;display:grid;gap:18px;justify-items:center;text-align:center;box-shadow:0 1px 0 var(--line),0 20px 40px -24px rgba(27,42,74,.45)}
.intro>.row:first-child{width:100%}
.intro-art{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;font-size:5rem}
/* picture login */
.login{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;gap:32px}
@media (max-width:720px){.login{grid-template-columns:minmax(0,1fr)}}
.login-who{display:grid;justify-items:center;gap:12px;padding-right:32px;border-right:1px solid var(--line)}
@media (max-width:720px){.login-who{border-right:0;padding-right:0}}
.login-pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:560px;justify-self:center;width:100%}
.pic{aspect-ratio:1;max-width:100%;border-radius:20px;border:2px solid var(--line);background:#fff;font-size:clamp(2.6rem,7vw,4.6rem);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.pic:hover{transform:translateY(-3px);border-color:var(--biro)}
.pic:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pdots{display:flex;gap:10px}
.pdots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--biro)}
.pdots span.on{background:var(--biro)}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}}
/* polish */
.card,.tile{box-shadow:0 1px 0 var(--line),0 10px 28px -18px rgba(27,42,74,.35)}
@media (prefers-reduced-motion:no-preference){main.anim>*{animation:rise .35s ease-out both}main.anim>*:nth-child(2){animation-delay:.04s}main.anim>*:nth-child(3){animation-delay:.08s}main.anim>*:nth-child(4){animation-delay:.12s}
 @keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
 .tile{transition:transform .15s,border-color .15s}.tile:not([aria-disabled="true"]):hover{transform:translateY(-2px)}}
.hero{background:var(--biro);color:var(--card);border-radius:18px;padding:22px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .muted{color:inherit;opacity:.8}
.hero .dot{border-color:rgba(255,255,255,.45)}
.hero .hl{background:linear-gradient(transparent 55%,rgba(255,216,77,.55) 55%)}
.ico{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;font-size:1.35rem;background:var(--biro-wash)}
.ico.y{background:var(--marker-wash)} .ico.g{background:var(--go-wash)} .ico.p{background:var(--calm-wash)}
.navbadge{display:inline-block;min-width:18px;margin-left:6px;background:var(--marker);color:var(--marker-ink);border-radius:99px;font-size:.7rem;padding:0 6px;font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
/* parent app */
.papp{border:1px solid var(--line);border-radius:22px;background:var(--card);overflow:hidden;box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(27,42,74,.45)}
.papp-head{background:var(--ink);color:var(--paper);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.papp-head .muted{color:inherit;opacity:.7}
.ptabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:var(--paper);overflow-x:auto}
.ptabs button{border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--soft);white-space:nowrap}
.ptabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line),0 2px 8px -4px rgba(0,0,0,.2)}
.ptabs button[aria-disabled="true"]{opacity:.55}
.pbody{padding:20px;display:grid;gap:16px}
.thread{display:grid;gap:12px;max-height:60vh;overflow-y:auto}
.bubble{max-width:88%;background:var(--paper);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;display:grid;gap:8px}
.bubble.reward{background:var(--marker-wash);border-color:var(--marker)}
.bubble.password{background:var(--biro-wash);border-color:var(--biro)}
.bubble.lock{background:var(--stop-wash);border-color:var(--stop)}
.from{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--soft)}
.free{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--go-wash);color:var(--ink);font-size:.88rem}
.chart text{fill:var(--soft);font-size:11px;font-family:var(--body)}
.chart .v{fill:var(--ink);font-weight:600}
.feed{display:grid;gap:0}
.feed div{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.feed div:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:50;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}}

/* app picker (sign-in hub) */
body[data-view="newtab"] footer{display:none}
.hub{position:fixed;inset:0;overflow:auto;z-index:40;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--card)}
.hub-brand{background:linear-gradient(150deg,#1E3FA8 0%,#2D57CC 38%,#13A8B8 100%);color:#fff;padding:56px clamp(32px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.hub-brand::after{content:"";position:absolute;inset:auto -120px -160px auto;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.08)}
.hub-brand::before{content:"";position:absolute;top:-90px;left:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06)}
.hub-brand .wm{font-family:var(--display);font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:10px}
.hub-brand h2{font-size:clamp(2rem,3.4vw,2.9rem);color:#fff;max-width:14ch;font-weight:800}
.hub-ben{display:grid;gap:18px;max-width:40ch;position:relative;z-index:1}
.hub-ben div{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.hub-ben span.i{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:1.3rem}
.hub-ben b{display:block;font-family:var(--display)}
.hub-ben p{margin:2px 0 0;opacity:.85;font-size:.93rem}
.hub-form{display:grid;place-items:center;padding:48px 24px}
.hub-in{width:min(400px,100%);display:grid;gap:24px}
.hub-logo{display:flex;flex-direction:column;align-items:center;gap:10px}
.hub-logo img{width:76px;height:76px;border-radius:20px;box-shadow:0 10px 30px rgba(45,87,204,.25)}
.hub-logo .wm{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--ink)}
.hub h1{font-size:1.75rem;text-align:center}
.hub .sub{text-align:center;color:var(--soft);margin:-14px 0 0}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick label{border:1.5px solid var(--line);border-radius:14px;padding:18px 14px;display:grid;justify-items:center;gap:6px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s,box-shadow .15s}
.pick label:hover{border-color:var(--biro)}
.pick label{position:relative}.pick input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;margin:0;inset:0}
.pick label:has(input:checked){border-color:var(--biro);background:var(--biro-wash);box-shadow:0 0 0 3px color-mix(in srgb,var(--biro) 18%,transparent)}
.pick label:has(input:focus-visible){outline:2px solid var(--biro);outline-offset:2px}
.pick .e{font-size:1.8rem}
.pick b{font-family:var(--display)}
.pick small{color:var(--soft)}
.hub .go{width:100%;padding:14px;font-size:1rem;border-radius:12px}
@media (max-width:820px){.hub{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
 .hub-brand{padding:22px 20px;gap:6px}.hub-brand h2{font-size:1.3rem;max-width:none}.hub-ben{display:none}.hub-brand::after,.hub-brand::before{display:none}
 .hub-form{padding:32px 16px}}
</style>

function parseNum(s){
  s = String(s).trim().replace(/\s+/g," ");
  let m;
  if ((m = s.match(/^(\d+) (\d+)\/(\d+)$/))) return +m[1] + (+m[2])/(+m[3]);
  if ((m = s.match(/^(-?\d+)\/(\d+)$/))) return +m[2] ? (+m[1])/(+m[2]) : NaN;
  s = s.replace(/,/g,"").replace(/\s*(cm²|cm2|cm|square centimetres|sq cm)$/i,"");
  return s === "" ? NaN : Number(s);
}

  const cols = ["#FFD84D","#2D57CC","#1C8455","#7A5BB5","#F08A72"];
  const ps = Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:Math.random()*-12-2,r:Math.random()*6+3,c:cols[rnd(0,4)],a:Math.random()*6}));

}

function lessonView(){
  const st = S.lesson, l = L(st.id);

  let body = "";
  if (st.stage==="explain") body = `<div class="card stack explain" style="gap:16px">${l.explain.map(p=>`<p>${esc(p)}</p>`).join("")}${l.visual()}
     ${st.alt?`<div class="panel"><b>Another way to see it</b><p style="margin-top:4px;white-space:pre-wrap">${esc(st.alt)}</p></div>`:""}
     <div class="row"><button class="btn primary" data-act="to-warm">I've read it</button><button class="btn" data-act="alt" ${st.altLoading?"disabled":""}>${st.altLoading?"Thinking…":"Explain it another way"}</button></div></div>`;

      ${qBody(st.warm)}
      ${st.warmNote?`<div class="panel">${esc(st.warmNote)}</div>`:""}
      ${answerArea(st.warm, l, "warm")}</form>`;
  }

      ${st.alt?`<div class="panel"><b>Another way to see it</b><p style="margin-top:4px;white-space:pre-wrap">${esc(st.alt)}</p></div><div class="row"><button class="btn primary" data-act="to-q">Okay, let's go</button></div>`
      :`<div class="row"><button class="btn primary" data-act="to-q">Yes, it's clear</button><button class="btn" data-act="alt-clear" ${st.altLoading?"disabled":""}>${st.altLoading?"Thinking…":"Not yet"}</button></div>`}</div>`;
  if (st.stage==="questions" || st.stage==="practice") body = questionCard(l, st);
  if (st.stage==="done") body = `<div class="card stack" style="gap:16px;justify-items:start">
      <div class="row"><span class="pill mark pop" style="font-size:1rem;padding:6px 14px">+1 ⭐ point</span><span class="pill biro pop" style="font-size:1rem;padding:6px 14px">+50 🪙 coins</span></div><h2>Lesson done, ${esc(S.name)}!</h2>${meter()}

  return `<section class="stack onbg"><span class="label">${esc(l.chapter)} › ${esc(l.topic)}</span><h1>${esc(l.title)}</h1>${steps}
    ${S.fsOn?"":`<p class="small muted">Lessons run in full screen. <button class="link" data-act="fs">Go full screen</button></p>`}</section>${body}`;

     <span class="small muted">Help is free. It never costs points.</span></div></div></form>`;

function finishLesson(){
  const st = S.lesson;
  S.points++; S.coins += 50; S.minutes += 15; S.justRewarded = S.points % 10 === 0;
  S.history[st.id] = "in-app"; S.todayDone = true;
  const stat = S.stats[st.id] ||= { warmMiss:0, wrongs:0, done:0 };
  stat.warmMiss += st.warmMiss; stat.wrongs += st.wrongs; stat.done++;
  if (S.justRewarded) notify(`${S.name} just reached ${S.points} points in MindLoop! Time for their reward: ${S.reward}.`, "reward");
  else notify(`${S.name} finished today's maths lesson (${L(st.id).title}). ${10-(S.points%10)} points to go until their reward.`, "update");
  logAct(`Finished ${L(st.id).title}`); st.stage = "done"; setTimeout(confetti, 120);
}

/* ---------- recaps ---------- */
function mathify(t, html=true){
  const F = (a,b) => html ? `<span class="fr" style="font-size:.85em">${'<span>'+a+'</span><span>'+b+'</span>'}</span>` : `${a}/${b}`;
  let x = html ? esc(t) : t;
  x = x.replace(/\\\(|\\\)/g, "");
  for (let i=0;i<3;i++) x = x.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,(m,a,b)=>F(a,b)).replace(/\\frac\s*\{([^{}]*)\}\s*(\w)/g,(m,a,b)=>F(a,b)).replace(/\\frac\s*(\w)\s*\{([^{}]*)\}/g,(m,a,b)=>F(a,b)).replace(/\\frac\s*(\w)(\w)/g,(m,a,b)=>F(a,b));
  x = x.replace(/\\sqrt\s*\{([^{}]*)\}/g,"√$1").replace(/\\sqrt/g,"√").replace(/\\overset\{[^{}]*\}\{([^{}]*)\}/g,"$1").replace(/\\mathrm\{([^{}]*)\}/g,"$1");
  const sym = {times:"×",div:"÷",space:" ",square:"□",rightarrow:"→",leq:"≤",geq:"≥",pi:"π",bigtriangleup:"△",ldots:"…",cdot:"·",degree:"°",circ:"°"};
  x = x.replace(/\\([a-zA-Z]+)/g,(m,k)=>sym[k]??"").replace(/\\[;,:! ]/g," ").replace(/\\([%$&#_])/g,"$1");
  x = html ? x.replace(/\^\{([^{}]*)\}/g,"<sup>$1</sup>").replace(/\^(\w)/g,"<sup>$1</sup>") : x.replace(/\^\{([^{}]*)\}/g,"^$1");
  return x.replace(/[{}]/g,"").replace(/\s{2,}/g," ");
}
function textbookView(){

  if (S.tbYear==null) S.tbYear = Math.min(S.year, 10);

  const match = cd => !q || cd.c.toLowerCase().includes(q) || cd.d.toLowerCase().includes(q) || cd.e.some(e=>e.toLowerCase().includes(q));
  const all = Y.strands.flatMap(st=>st.cds.map(cd=>({...cd, strand:st.n})));
  const sel = all.find(cd=>cd.c===S.tbCode);
  const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
  const short = t => { t = cap(mathify(t,false)); return t.length>70 ? t.slice(0,68).replace(/\s+\S*$/,"")+"…" : t; };
  const linked = c => (C.lessons[c]||[]).map(L).filter(Boolean);
  let content;
  if (sel){
    const ls = linked(sel.c);
    content = `<div class="row" style="justify-content:space-between"><span class="label">${esc(Y.label)} › ${esc(sel.strand)}</span><span class="pill biro">${esc(sel.c)}</span></div>

      <ul class="stack" style="gap:8px;padding-left:20px;margin:0;max-width:70ch">${sel.e.map(e=>`<li>${cap(mathify(e))}</li>`).join("")}</ul>`;
  } else {
    content = `<span class="label">${esc(Y.label)} Mathematics</span><h2>What ${esc(Y.label)} covers</h2>
      <div class="row">${Y.strands.map(st=>`<span class="pill biro">${esc(st.n)} · ${st.cds.length}</span>`).join("")}</div>
      <p style="max-width:70ch;white-space:pre-line">${mathify(Y.as)}</p>
      <p class="small muted">Pick a topic on the left to see what it means and practise it.</p>`;
  }
  return `<div class="book">
   <nav class="toc" aria-label="Topics">
     <input type="text" id="tb-search" data-tb="search" placeholder="🔍 Search topics" value="${esc(S.tbSearch)}" aria-label="Search the textbook">
     <div class="toc-book"><i aria-hidden="true"></i><select id="tb-year" data-tbyear="1" aria-label="Year level" style="border:0;background:none;font-weight:600;padding:0">${C.years.map(y=>`<option value="${y.y}" ${y.y===S.tbYear?"selected":""}>${esc(y.label)} Maths</option>`).join("")}</select></div>
     ${Y.strands.map((st,i)=>{ const cds = st.cds.filter(match); if (q && !cds.length) return "";
       const open = q || S.chapter===st.n;
       return `<div><button class="chap" data-act="chap" data-c="${esc(st.n)}" aria-expanded="${!!open}">${i+1}. ${esc(st.n)} <span class="small muted">(${st.cds.length})</span></button>
       ${open?`<div class="sub">${cds.map(cd=>`<button data-act="tbcode" data-id="${cd.c}" aria-current="${cd.c===S.tbCode}">${(C.lessons[cd.c]||[]).length?"⭐ ":""}${esc(short(cd.d))}</button>`).join("")}</div>`:""}</div>`;}).join("")}
     <p class="small muted" style="padding:6px">⭐ = has a MindLoop lesson</p>
   </nav>
   <div class="book-c">${content}<p class="small muted" style="margin-top:auto">Source: Australian Curriculum v9. ${esc(C.credit)}</p></div>
  </div>`;
}

async function sendChat(text){
  const c = S.chat, l = L(c.sel); text = text.trim(); if (!text || c.locked || c.banned) return;
  if (BLOCK.test(text)) { lockChat(text); render(); return; }
  if (!useAi()) { toast(`That's all ${T1_AI_LIMIT} questions for today. Come back tomorrow!`); render(); return; }
  c.msgs.push({ role:"user", content:text }); render();

  let reply;
  if (!SAMPLE) reply = CANNED[text] || "This is a preview, so the live AI isn't connected here. Open the prototype inside Claude to chat with the tutor for real.";
  else {
    chatCtl = new AbortController();
    try {
      const turns = c.msgs.slice(-10);
      const r = await SAMPLE([{ role:"user", content:rules(l) }, ...turns], { modelTier:"quick", cache:false, signal:chatCtl.signal,
        onText:({text}) => { if (!text.trim().startsWith("[[")) { box.textContent = text; scrollMsgs(); } } });

}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t || t.getAttribute("aria-disabled")==="true") return;
  const a = t.dataset.act, st = S.lesson;
  if (a==="go"){ S.view = t.dataset.v; if (S.view==="parent"){ S.unread = 0; } S.justRewarded = false; window.scrollTo(0,0); }
  else if (a==="start"){ startLesson(t.dataset.id); window.scrollTo(0,0); }
  else if (a==="fs"){ try { document.documentElement.requestFullscreen().then(()=>{S.fsOn=true;render();}).catch(()=>toast("Full screen isn't available in this view.")); } catch { toast("Full screen isn't available in this view."); } return; }
  else if (a==="to-warm"){ st.stage="warmup"; st.warm=null; st.warmNote=null; }
  else if (a==="to-q"){ st.stage="questions"; st.q = newQuestions(L(st.id), 5, 1); }
  else if (a==="alt" || a==="alt-clear"){
    const l = L(st.id); if (SAMPLE && !useAi()){ toast(`That is all ${T1_AI_LIMIT} AI questions for today`); return; } st.altLoading = true; render();
    if (!SAMPLE) st.alt = l.alt;
    else { try { st.alt = (await SAMPLE(`Explain "${l.title}" to a ${YEARS[S.year]} student in a different way from this explanation: "${l.explain.join(" ")}". Use one everyday example. Under 110 words, simple words, plain text, no headings or markdown.`, { modelTier:"quick" })).text.trim(); }
      catch(err){ st.alt = l.alt; toast(aiErr(err)); } }
    st.altLoading = false;
  }
  else if (a==="choose"){ const i = +t.dataset.i; if (t.dataset.k==="warm") gradeWarm(i===st.warm.ans); else gradeQ(i===st.q.list[st.q.i].ans, i); }
  else if (a==="remind"){ st.q.remind = !st.q.remind; }
  else if (a==="worked"){ st.q.worked = !st.q.worked; }
  else if (a==="reveal"){ const q = st.q.list[st.q.i]; st.q.status="reveal"; st.q.fb = `The answer is <b>${esc(q.ansText)}</b>. ${esc(q.remind)}`; }
  else if (a==="next"){
    const Q = st.q;
    if (Q.i+1 < Q.list.length){ Object.assign(Q, { i:Q.i+1, tries:0, tried:[], status:"open", remind:false, worked:false, fb:null }); }
    else if (st.stage==="questions") finishLesson();
    else { S.view="home"; toast("Practice done. Nice work!"); }
  }
  else if (a==="practice"){ const level = st.wrongs>=2?0:st.wrongs===1?1:2; st.stage="practice"; st.q = newQuestions(L(st.id), 3, level); S.justRewarded=false; }
  else if (a==="pic"){
    LOGIN.shake = false; LOGIN.taps.push(t.dataset.k);
    if (LOGIN.taps.length===3){
      if (LOGIN.taps.join()===(S.pics||["cat","dog","fish"]).join()){ LOGIN.ok = true; render(); setTimeout(()=>{ LOGIN = { taps:[], fails:0, order:null, shake:false, ok:false }; S.view="home"; render(); toast(`Welcome back, ${S.name}!`); }, 700); return; }
      LOGIN.fails++; LOGIN.taps = []; LOGIN.shake = true; LOGIN.order = shuffle(PICS);
    }
  }
  else if (a==="kl-no"){ KL.ask=false; KL.user=""; render(); document.getElementById("kl-user")?.focus(); return; }
  else if (a==="kl-yes"){ KL.ask=false; KL.step="pw"; LOGIN.taps=[]; LOGIN.ok=false; LOGIN.fails=0; render(); return; }
  else if (a==="kl-back"){ KL.step="user"; KL.user=""; render(); return; }
  else if (a==="pw-show"){ LOGIN.show = !LOGIN.show; const v = document.getElementById("li-pw").value; render(); const n = document.getElementById("li-pw"); n.value = v; n.focus(); return; }
  else if (a==="login-mode"){ S.loginMode = t.dataset.m; LOGIN = { taps:[], fails:0, order:null, shake:false, ok:false, show:false }; }
  else if (a==="pp-pic"){ PWD.pics.length>=3 ? PWD.pics=[t.dataset.k] : PWD.pics.push(t.dataset.k); }
  else if (a==="pp-clear"){ PWD.pics = []; }
  else if (a==="pp-mode"){ PWD.mode = t.dataset.m; }
  else if (a==="pp-save"){
    if (PWD.mode==="picture"){ if (PWD.pics.length<3){ toast("Pick 3 pictures first"); return; } S.pics = [...PWD.pics]; S.loginMode = "picture"; }
    else { const a1 = document.getElementById("pp-pw").value, a2 = document.getElementById("pp-pw2").value, u = document.getElementById("pp-user").value.trim();
      if (a1.length < 6){ PWD.err = "Use at least 6 characters."; render(); return; } if (a1!==a2){ PWD.err = "The two passwords don't match."; render(); return; }
      S.pw = a1; S.username = u || S.name.toLowerCase(); S.loginMode = "typed"; }
    PWD.err = null; LOGIN = { taps:[], fails:0, order:null, shake:false, ok:false, show:false };
    notify(`You changed ${S.name}'s login. New details: ${pwText()}. Any devices ${S.name} is logged in on stay logged in.`, "password");
    S.unread = 0; toast("Password saved");
  }
  else if (a==="pic-reset"){ LOGIN = { taps:[], fails:0, order:shuffle(PICS), shake:false, ok:false }; }
  else if (a==="recap"){ S.recap = t.dataset.id; }
  else if (a==="open-recap"){ S.recap = t.dataset.id; S.view = "recaps"; window.scrollTo(0,0); }
  else if (a==="intro-step"){ INTRO += +t.dataset.d; render(); return; }
  else if (a==="intro-done"){ INTRO = 0; if (S.introWho==="kid"){ S.kidIntroSeen = true; S.view = "home"; } else { S.introSeen = true; S.view = "setup"; } window.scrollTo(0,0); }
  else if (a==="hub-pick"){ HUB = t.value; return; }
  else if (a==="app-parent"){ INTRO = 0; S.introWho = "parent"; S.view = "intro"; PL.err = false; window.scrollTo(0,0); }
  else if (a==="app-kid"){ KL = { user:"", ask:false, step:"user" }; LOGIN = { taps:[], fails:0, order:null, shake:false, ok:false, show:false }; S.view = "login"; window.scrollTo(0,0); }
  else if (a==="kid-intro"){ INTRO = 0; S.kidIntroSeen = false; S.introWho = "kid"; S.view = "intro"; }
  else if (a==="intro-replay"){ INTRO = 0; S.introSeen = false; S.kidIntroSeen = false; S.introWho = "parent"; S.view = "intro"; }
  else if (a==="chap"){ S.chapter = S.chapter===t.dataset.c ? null : t.dataset.c; }
  else if (a==="tbcode"){ S.tbCode = t.dataset.id; }
  else if (a==="open-recap-any"){ S.recap = t.dataset.id; S.view = "recaps"; }
  else if (a==="shoptab"){ S.shopTab = t.dataset.t; }
  else if (a==="buy" || a==="equip"){
    const it = Object.values(SHOP).flat().find(x=>x.id===t.dataset.id);
    if (a==="buy"){ if (S.coins < it.cost) return; S.coins -= it.cost; S.owned.push(it.id); toast(`Bought for ${it.cost} coins`); }
    if (it.emoji) S.avatar = it.emoji; else if (it.id.startsWith("bg-")) S.bg = it.key; else S.frame = it.key;
  }
  else if (a==="preset"){ sendChat(t.dataset.p); return; }
  else if (a==="ptab"){ S.ptab = t.dataset.t; PWD = null; }
  else if (a==="p-ban"){ S.chat.banned = true; S.chat.locked = false; logAct("You turned off the AI chat"); toast("Chat turned off"); }
  else if (a==="p-unlock"){ S.chat.locked = false; logAct("You unlocked the AI chat"); toast("Chat unlocked"); }
  else if (a==="p-chat"){ S.chat.banned = !t.checked; if (!S.chat.banned) S.chat.locked = false; logAct(S.chat.banned?"You turned off the AI chat":"You turned on the AI chat"); }
  else if (a==="p-ctl"){ S.controls[t.dataset.k] = t.checked; }
  else if (a==="upgrade-hint"){ toast("The dashboard comes with Tier 2"); return; }
  else if (a==="upgrade"){ S.tier = 2; S.ptab = "dashboard"; toast("Switched to Tier 2"); }
  else if (a==="downgrade"){ S.tier = 1; S.ptab = "messages"; toast("Switched to Tier 1"); }
  else if (a==="p-cancel"){ toast("In the real app this would confirm, then cancel at the end of the billing period"); return; }
  else if (a==="p-logout"){ S.view = "blank"; toast("Logged out"); }
  else return;
  render();
});

function gradeWarm(ok){
  const st = S.lesson;
  if (ok){ st.stage = "clear"; st.alt = null; }
  else { st.warmMiss++; st.warmNote = `Not quite. ${st.warm.remind} Here's a fresh one to try.`; st.warm = L(st.id).gen(0); }
}
function gradeQ(ok, choice){
  const st = S.lesson, Q = st.q;
  if (ok){ Q.status = "right"; Q.fb = pick(["That's right!","Spot on.","Yes! Nice work.","Correct."]); if (st.stage==="practice"){ S.coins += 10; Q.fb += " +10 🪙"; } }
  else { Q.tries++; if (choice!=null) (Q.tried ||= []).push(choice); if (st.stage==="questions") st.wrongs++; Q.fb = Q.tries===1 ? "Not quite. Have another go. The help buttons are there if you want them." : "Still not it. Try the reminder or worked example, or see the answer below."; }
}

    if (p1!==p2){ toast("The two passwords don't match"); document.getElementById("f-ppw2").focus(); return; }
    S.parentPw = p1;
    if (!S.pwSent){ S.pwSent = true;
      notify(`Payment received. ${S.name}'s account is ready! Log in with ${pwText()}. Keep this message safe. You can change the password any time in the parent app.`, "password"); }
    S.view = "parent"; window.scrollTo(0,0); }
  else if (form==="warm"){
    const v = parseNum(document.getElementById("ans-warm").value);
    if (isNaN(v)) return;
    gradeWarm(Math.abs(v - st.warm.ans) < (st.warm.tol || 1e-9));
  }
  else if (form==="q"){
    const v = parseNum(document.getElementById("ans-q").value);
    if (isNaN(v)) { toast("Type a number or a fraction like 5/8"); return; }
    gradeQ(Math.abs(v - st.q.list[st.q.i].ans) < (st.q.list[st.q.i].tol || 1e-9));
  }
  else if (form==="chat"){ const i = document.getElementById("chat-in"); const v = i.value; i.value = ""; sendChat(v); return; }
  else if (form==="code"){ const v = document.getElementById("code-in").value.trim(); if (v===S.chat.code){ S.chat.locked=false; S.chat.codeErr=false; toast("Chat unlocked"); } else S.chat.codeErr = true; }
  else if (form==="typed"){
    const ok = document.getElementById("li-user").value.trim().toLowerCase()===(S.username||S.name.toLowerCase()).toLowerCase() && document.getElementById("li-pw").value===(S.pw||"maths123");
    if (ok){ LOGIN.ok = true; render(); setTimeout(()=>{ LOGIN = { taps:[], fails:0, order:null, shake:false, ok:false, show:false }; S.view="home"; render(); toast(`Welcome back, ${S.name}!`); }, 600); return; }
    LOGIN.fails++; LOGIN.shake = true; render(); setTimeout(()=>{ LOGIN.shake=false; }, 450); return;
  }
  else if (form==="kidtest"){ notify(`${S.name} added a ${document.getElementById("kt-topic").value} test on ${niceDate(document.getElementById("kt-date").value)}. Light revision starts two weeks before. Add it yourself for the full plan.`, "info"); S.tests.push({ id:Date.now(), topic:document.getElementById("kt-topic").value, date:document.getElementById("kt-date").value, by:"kid" }); toast("Test added. Practice starts two weeks before."); }
  else if (form==="ptest"){ S.tests.push({ id:Date.now(), topic:document.getElementById("pt-topic").value, date:document.getElementById("pt-date").value, by:"parent" }); }
  render();
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.f){
    const k = el.dataset.f; S[k] = (k==="year"||k==="tier") ? +el.value : el.value;
    if (k==="year"||k==="tier"){ const pb = document.getElementById("price-box"); if (pb) pb.innerHTML = priceOpts(prices(S.tier, S.year)); }
    if (k==="name"){ save(); return; }
    save(); return;
  }
  if (el.dataset.c){ S.chat.sel = el.dataset.c==="chap" ? YL().find(x=>x.chapter===el.value).id : el.value; S.chat.msgs = []; render(); }
  if (el.dataset.tbyear){ S.tbYear = +el.value; S.tbCode = null; S.chapter = null; render(); return; }
  if (el.dataset.pc==="limit"){ S.chat.limit = el.value; save(); }
});
document.addEventListener("input", e => { const el = e.target; if (el.dataset.tb){ S.tbSearch = el.value; const pos = el.selectionStart; render(); const n = document.getElementById("tb-search"); n.focus(); n.setSelectionRange(pos,pos); return; } if (el.dataset.f && (el.type==="text"||el.type==="tel"||el.type==="password")){ S[el.dataset.f] = el.value; save(); } });

document.addEventListener("keydown", e => { if (S.view!=="intro") return; const n = SLIDES[S.introWho].length; if (e.key==="ArrowRight" && INTRO<n-1){ INTRO++; render(); } if (e.key==="ArrowLeft" && INTRO>0){ INTRO--; render(); } });
document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) { S.fsOn = true; return; }
  if (S.fsOn && S.view==="lesson" && S.lesson) S.fsLog.push({ time:now(), lesson:L(S.lesson.id).title });
  S.fsOn = false; render();
});

S.fsOn = false; if (S.view==="lesson" && !S.lesson) S.view = "home";
render();
</script>
